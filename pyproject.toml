[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-mcp"
version = "0.1.0"
description = "Semantic search MCP server for any project — indexes code, docs, and configs using ChromaDB."
requires-python = ">=3.9"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0",
    "chromadb>=0.5.0,<2.0",
    "sentence-transformers>=2.2.0,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
catalog-mcp = "catalog_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
